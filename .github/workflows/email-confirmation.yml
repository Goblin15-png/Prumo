name: Email confirmation
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'testes/backend/**'
      - '.github/workflows/email-confirmation.yml'
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, intl, pdo_sqlite, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: cp .env.example .env && php artisan key:generate
        working-directory: backend
      - run: npm --prefix testes run test:php -- --filter 'EmailVerificationCodeTest|SecurityControlsTest'
